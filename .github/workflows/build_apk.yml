name: iOS IPA Build and Upload to Telegram & Artifacts

on:
  workflow_dispatch:
    inputs:
      share_to_telegram:
        description: 'Upload IPA to Telegram?'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode version
        run: sudo xcode-select -s /Applications/Xcode_14.3.app  # Adjust as needed

      - name: Get Commit SHA and URL
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          REPO_URL="https://github.com/${{ github.repository }}"
          COMMIT_URL="${REPO_URL}/commit/${COMMIT_SHA}"
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_URL=$COMMIT_URL" >> $GITHUB_ENV

      - name: Build Archive
        run: |
          xcodebuild -scheme YourSchemeName -workspace YourWorkspace.xcworkspace \
          -configuration Release -archivePath build/YourApp.xcarchive archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
          -archivePath build/YourApp.xcarchive \
          -exportPath build/exported \
          -exportOptionsPlist exportOptions.plist  # Make sure this file exists

      - name: Find IPA
        id: find_ipa
        run: |
          IPA_PATH=$(find build/exported -name "*.ipa")
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV

      - name: Upload IPA to Telegram
        if: ${{ github.event.inputs.share_to_telegram == 'true' }}
        run: |
          curl -F document=@"${{ env.IPA_PATH }}" \
          -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -F parse_mode=Markdown \
          https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "iOS IPA - ${{ env.COMMIT_SHA }}"
          path: "${{ env.IPA_PATH }}"
