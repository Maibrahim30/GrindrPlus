name: iOS Build and Upload to Telegram & Artifacts

on:
  workflow_dispatch:
    inputs:
      share_to_telegram:
        description: 'Upload IPA to Telegram?'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Ruby for CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod install

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app # or the desired version

      - name: Get Commit SHA and URL
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          REPO_URL="https://github.com/${{ github.repository }}"
          COMMIT_URL="${REPO_URL}/commit/${COMMIT_SHA}"
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_URL=$COMMIT_URL" >> $GITHUB_ENV

      - name: Build the iOS App (.ipa)
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/certs
          echo "$CERTIFICATE_BASE64" | base64 --decode > ~/certs/cert.p12
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > ~/certs/profile.mobileprovision

          # Install signing certificate
          security create-keychain -p "" build.keychain
          security import ~/certs/cert.p12 -k build.keychain -P "$P12_PASSWORD" -A
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings

          # Copy provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(grep -a -E -o "[-A-F0-9]{36}" ~/certs/profile.mobileprovision | head -1)
          cp ~/certs/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

          # Build the app
          xcodebuild -workspace YourApp.xcworkspace \
            -scheme YourApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/YourApp.xcarchive archive

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath $PWD/build/YourApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/build

      - name: Upload IPA to Telegram
        if: ${{ github.event.inputs.share_to_telegram == 'true' }}
        run: |
          curl -F document=@"build/YourApp.ipa" \
          -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -F parse_mode=Markdown \
          https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "iOS App IPA"
          path: build/YourApp.ipa
