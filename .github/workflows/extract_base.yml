name: Extract and Upload IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the IPA bundle"
        required: true
        default: ""

jobs:
  extract-and-upload:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Create working directory
      run: mkdir extracted_ipa

    - name: Download IPA bundle
      run: |
        echo "Downloading IPA from ${{ github.event.inputs.ipa_url }}"
        curl -L -o extracted_ipa/app.ipa "${{ github.event.inputs.ipa_url }}"

    - name: Verify IPA exists
      run: |
        if [ -f extracted_ipa/app.ipa ]; then
          echo "app.ipa found. Preparing to upload..."
        else
          echo "app.ipa not found. Make sure the URL is correct and the file is accessible."
          exit 1
        fi

    - name: Upload IPA
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: app.ipa
        path: extracted_ipa/app.ipa
